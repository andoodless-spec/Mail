name: Тихий ящик 2.4.1 (оформление v34) — распаковка архива

# Распаковщик под конкретную поставку: quiet-mailbox-v34.zip, версия 2.4.1, appearanceVersion 34.
# Запуск: положить архив в корень основной ветки (или Actions → Run workflow).

on:
  push:
    paths:
      - 'quiet-mailbox-v34.zip'
      - '.github/workflows/unzip-quiet-mailbox.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip-quiet-mailbox-v34
  cancel-in-progress: false

env:
  # ▼▼▼ конкретная версия: архив, его SHA-256 и ожидаемые значения ▼▼▼
  ARCHIVE: quiet-mailbox-v34.zip
  ARCHIVE_SHA256: ffbfd9e8960ef1639c1e3c768aa839ac9ede2aae73f28cce2ee61953a0bbe6a1
  ARCHIVE_BYTES: '265606'
  ZIP_ROOT: quiet-mailbox
  EXPECT_VERSION: 2.4.1
  EXPECT_APPEARANCE: '34'
  EXPECT_FILES: '114'
  # ▲▲▲ если пересобрали архив — обновите эти пять значений ▲▲▲

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить, что загружен именно нужный архив
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Нет файла $ARCHIVE в корне ветки $GITHUB_REF_NAME. Нужен именно он, другие архивы этот workflow не обрабатывает."
            exit 1
          fi
          bytes="$(stat -c%s "$ARCHIVE")"
          hash="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          echo "Файл: $ARCHIVE"
          echo "Размер: $bytes байт (ожидается $ARCHIVE_BYTES)"
          echo "SHA-256: $hash"
          if [ "$hash" != "$ARCHIVE_SHA256" ]; then
            echo "::error::Контрольная сумма не совпадает с версией 2.4.1. Это другой файл или архив докачался не полностью. Файлы в репозитории не изменены. Если архив пересобран намеренно — обновите ARCHIVE_SHA256 и ARCHIVE_BYTES в workflow."
            exit 1
          fi
          echo "Это тот самый архив 2.4.1."

      - name: Распаковать
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/unpacked"
          rm -rf "$target"; mkdir -p "$target"
          unzip -q "$ARCHIVE" -d "$target" || { echo "::error::Архив повреждён. Файлы в репозитории не изменены."; exit 1; }
          root="$target/$ZIP_ROOT"
          [ -d "$root" ] || { echo "::error::В архиве нет папки $ZIP_ROOT/ — это не поставка «Тихого ящика»."; exit 1; }
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Файлов в архиве: $(find "$root" -type f | wc -l)"

      - name: Сверить версию и состав с ожидаемым
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.unpack.outputs.root }}"
          cd "$root"

          files="$(find . -type f | wc -l)"
          [ "$files" = "$EXPECT_FILES" ] || { echo "::error::В архиве $files файлов вместо $EXPECT_FILES. Состав не тот, что в 2.4.1."; exit 1; }

          version="$(node -p "require('./package.json').version")"
          [ "$version" = "$EXPECT_VERSION" ] || { echo "::error::package.json: версия $version вместо $EXPECT_VERSION"; exit 1; }

          rel="$(node -p "const r=require('./RELEASE.json'); r.version+' / '+r.appearanceVersion")"
          [ "$rel" = "$EXPECT_VERSION / $EXPECT_APPEARANCE" ] || { echo "::error::RELEASE.json: $rel вместо $EXPECT_VERSION / $EXPECT_APPEARANCE"; exit 1; }

          # то, что появилось именно в этой версии
          for f in settings.js backup.js RELEASE-v341.md assets/ui/anniversary.svg assets/ui/profile.svg assets/ui/palette.svg; do
            [ -f "$f" ] || { echo "::error::Нет файла $f — это архив не 2.4.1 (v34)."; exit 1; }
          done
          grep -q 'settings.js?v=35' index.html || { echo "::error::index.html не подключает settings.js?v=35"; exit 1; }
          for tab in settingsPanelAppearance settingsPanelLayout settingsPanelAlerts settingsPanelAccount; do
            grep -q "$tab" index.html || { echo "::error::В index.html нет вкладки $tab"; exit 1; }
          done
          grep -q 'appearanceVersion: 34' lib/preferences.js || { echo "::error::lib/preferences.js без appearanceVersion 34"; exit 1; }
          echo "Версия 2.4.1 / оформление v34 подтверждена по файлам."

      - name: Не пускать в репозиторий секреты и мусор
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.unpack.outputs.root }}"
          bad="$(find "$root" \( -name '.env' -o -name '.env.*' -o -name 'node_modules' -o -name 'dist' -o -name 'test-artifacts' -o -name '.git' -o -name '*.pem' \) -print -quit)"
          [ -z "$bad" ] || { echo "::error::В архиве лишнее: $bad. Распаковка остановлена."; exit 1; }
          echo "Секретов и артефактов сборки нет."

      - name: Прогнать проверки этой версии (без npm install)
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.unpack.outputs.root }}"
          for f in app.js redesign.js backup.js settings.js lib/preferences.js lib/http.js lib/db.js lib/games.js api/'[...path].js'; do
            node --check "$f" || { echo "::error::Синтаксическая ошибка в $f"; exit 1; }
          done
          node tests/preferences.mjs || { echo "::error::Настройки (preferences) не прошли"; exit 1; }
          node tests/fallback.mjs    || { echo "::error::Локальный режим (fallback) не прошёл"; exit 1; }
          node tests/backup.mjs      || { echo "::error::Резервные копии (backup) не прошли"; exit 1; }

      - name: Скопировать в корень репозитория, не удаляя лишнего
        shell: bash
        run: |
          set -euo pipefail
          cp -R "${{ steps.unpack.outputs.root }}"/. .
          echo "Скопировано: $(find "${{ steps.unpack.outputs.root }}" -type f | wc -l) файлов"

      - name: Сверить в ветке байт в байт
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.unpack.outputs.root }}"
          bad=0
          while IFS= read -r -d '' f; do
            rel="${f#"$root"/}"
            if [ ! -f "$rel" ]; then echo "::error::Не скопирован: $rel"; bad=1; continue; fi
            cmp -s "$f" "$rel" || { echo "::error::Отличается: $rel"; bad=1; }
          done < <(find "$root" -type f -print0)
          [ "$bad" -eq 0 ] || { echo "::error::Проверка не прошла, коммит не отправлен."; exit 1; }
          echo "В ветке лежит точно содержимое архива."

      - name: Закоммитить в основную ветку
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "В ветке уже ровно эта версия — коммит не нужен."
            exit 0
          fi
          git commit -m "Тихий ящик 2.4.1 (оформление v34)"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "::error::Push отклонён. Settings → Actions → General → Workflow permissions → Read and write permissions. Защищённую ветку этот workflow не обходит."
            exit 1
          }
          echo "ГОТОВО: 2.4.1 / v34 в ветке ${GITHUB_REF_NAME}, коммит $(git rev-parse --short HEAD)."
