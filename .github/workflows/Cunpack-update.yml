name: Распаковать Тихий ящик и проверить файлы

# Запускается, когда в корень основной ветки загрузили архив quiet-mailbox*.zip.
# Можно запустить и вручную: Actions → «Распаковать Тихий ящик и проверить файлы» → Run workflow.

on:
  push:
    paths:
      - 'quiet-mailbox*.zip'
      - '.github/workflows/unzip-quiet-mailbox.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip-quiet-mailbox
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Найти архив в корне
        id: find
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(quiet-mailbox*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::В корне репозитория нет архива quiet-mailbox*.zip. Загрузите его в корень основной ветки."
            exit 1
          fi
          if [ "${#files[@]}" -gt 1 ]; then
            echo "::error::Найдено несколько архивов: ${files[*]}. Оставьте только один, иначе непонятно, какой распаковывать."
            exit 1
          fi
          echo "archive=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "Архив: ${files[0]} ($(du -h "${files[0]}" | cut -f1))"

      - name: Распаковать во временную папку
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/unpacked"
          rm -rf "$target"
          mkdir -p "$target"
          unzip -q "${{ steps.find.outputs.archive }}" -d "$target" || {
            echo "::error::Архив повреждён или это не ZIP. Файлы в репозитории не изменены."
            exit 1
          }
          # Архив собран с вложенной папкой quiet-mailbox/, иногда её может не быть.
          root="$target"
          if [ ! -f "$target/package.json" ]; then
            only="$(find "$target" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$only" ] && [ -f "$only/package.json" ]; then root="$only"; fi
          fi
          if [ ! -f "$root/package.json" ] || [ ! -f "$root/index.html" ]; then
            echo "::error::Внутри архива нет package.json или index.html. Похоже, это не архив «Тихого ящика»."
            exit 1
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Версия в архиве: $(node -p "require('$root/package.json').version")"
          echo "Файлов в архиве: $(find "$root" -type f | wc -l)"

      - name: Проверить, что архив не содержит секретов и мусора
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.unpack.outputs.root }}"
          bad="$(find "$root" \( -name '.env' -o -name '.env.*' -o -name 'node_modules' -o -name 'dist' -o -name 'test-artifacts' -o -name '.git' -o -name '*.pem' \) -print -quit)"
          if [ -n "$bad" ]; then
            echo "::error::В архиве есть то, чего быть не должно: $bad. Распаковка остановлена, файлы не изменены."
            exit 1
          fi
          echo "Секретов и артефактов сборки в архиве нет."

      - name: Проверить код до копирования
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.unpack.outputs.root }}"
          cd "$root"
          for file in app.js redesign.js backup.js settings.js lib/preferences.js lib/http.js lib/db.js api/'[...path].js'; do
            node --check "$file" || { echo "::error::Синтаксическая ошибка в $file"; exit 1; }
          done
          for file in index.html style.css redesign.css manifest.json; do
            [ -f "$file" ] || { echo "::error::Не хватает обязательного файла $file"; exit 1; }
          done
          # Эти три проверки не требуют npm install: только Node.
          node tests/preferences.mjs || { echo "::error::Проверка настроек не прошла"; exit 1; }
          node tests/fallback.mjs   || { echo "::error::Проверка локального режима не прошла"; exit 1; }
          node tests/backup.mjs     || { echo "::error::Проверка резервных копий не прошла"; exit 1; }

      - name: Скопировать файлы в корень репозитория
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.unpack.outputs.root }}"
          # Копируем поверх, ничего не удаляя: посторонние файлы в репозитории
          # остаются на месте. Архив и .github не трогаем.
          cp -R "$root"/. .
          echo "Скопировано файлов: $(find "$root" -type f | wc -l)"

      - name: Сверить, что каждый файл лёг байт в байт
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.unpack.outputs.root }}"
          mismatched=0
          while IFS= read -r -d '' file; do
            rel="${file#"$root"/}"
            if [ ! -f "$rel" ]; then
              echo "::error::Файл не скопировался: $rel"; mismatched=1; continue
            fi
            if ! cmp -s "$file" "$rel"; then
              echo "::error::Содержимое отличается: $rel"; mismatched=1
            fi
          done < <(find "$root" -type f -print0)
          if [ "$mismatched" -ne 0 ]; then
            echo "::error::Проверка не прошла. Ничего не отправлено в ветку — исправьте архив и загрузите снова."
            exit 1
          fi
          echo "Все файлы совпадают с архивом."

      - name: Отправить изменения в ту же ветку
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет: в репозитории уже эта версия. Коммит не нужен."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          git commit -m "Тихий ящик ${version}: распаковка архива"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "::error::Не удалось отправить коммит. Проверьте Settings → Actions → General → Workflow permissions → Read and write permissions. Защищённую ветку этот workflow не обходит."
            exit 1
          }
          echo "ГОТОВО: все $(find . -maxdepth 1 -name '*.js' | wc -l) файлов на месте. Версия ${version} в ветке ${GITHUB_REF_NAME}."
          echo "Коммит: $(git rev-parse --short HEAD)"
