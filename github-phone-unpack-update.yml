name: Опубликовать обновление Тихого ящика из ZIP

on:
  workflow_dispatch:
    inputs:
      archive:
        description: Имя ZIP в корне этого репозитория
        required: true
        default: quiet-mailbox-vercel-v27.zip
        type: string

permissions:
  contents: write

jobs:
  unpack-update:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать текущий репозиторий
        uses: actions/checkout@v4

      - name: Проверить загруженный ZIP
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: |
          test -n "$ARCHIVE"
          test "$(basename "$ARCHIVE")" = "$ARCHIVE"
          test -f "$ARCHIVE"

      - name: Распаковать обновление в текущий проект
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: unzip -o -q "$ARCHIVE" -d .

      - name: Сохранить исходники в GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Обновить Тихий ящик из ZIP"
            git push
          fi
